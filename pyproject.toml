[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "InstacallMonitor"
version = "3.0.0"
description = "InstacallMonitor - Real-time balance and margin monitoring for Instacall Switch Portal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["monitoring", "balance", "margin", "instacall", "alerts", "telecom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "plyer>=2.1.0",
    "tomli>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "types-requests>=2.32",
    "types-beautifulsoup4>=4.12",
]

[project.scripts]
instacallmonitor = "app:main"

[project.urls]
Homepage = "https://github.com/siamakanda/InstacallMonitor"
Repository = "https://github.com/siamakanda/InstacallMonitor"
Issues = "https://github.com/siamakanda/InstacallMonitor/issues"

[tool.setuptools]
py-modules = [
    "alerts",
    "app",
    "audio",
    "auth",
    "circuit_breaker",
    "cli",
    "config",
    "credentials",
    "cycles",
    "dashboard_ui",
    "display",
    "health",
    "monitor",
    "notify",
    "persistence",
    "reporting",
    "runtime",
    "scraper_client",
    "scraper_parser",
    "scrapers",
    "settings_diff",
    "settings_models",
    "settings_validation",
    "siren",
    "webapp",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Self-contained HTML/CSS/JS page: long embedded lines are not reformattable as Python.
"dashboard_ui.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = '(^|/)(venv|\.venv)/'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: timing-sensitive test that sleeps on wall-clock time",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/venv/*", "*/.venv/*", "*/site-packages/*"]
